services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      BEACHBOARD_HOST: 0.0.0.0
      BEACHBOARD_DATABASE: /data/beachboard.sqlite
      BEACHBOARD_UPLOAD_DIR: /data/uploads
      MAIL_RELAY_PASSWORD: relay-Fall2026-synthetic
    volumes:
      - beachboard-data:/data
      - .:/app

  debug:
    build: .
    command: ["python", "-m", "beachboard.debug_server"]
    ports:
      - "8081:8081"
    environment:
      MAIL_RELAY_PASSWORD: relay-Fall2026-synthetic

volumes:
  beachboard-data:
