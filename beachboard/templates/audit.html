{% extends "base.html" %}
{% block content %}
<h1>Audit log</h1>
<table><tr><th>Time</th><th>Actor</th><th>Action</th></tr>
{% for row in rows %}<tr><td>{{ row['created_at'] }}</td><td>{{ row['actor_id'] }}</td><td>{{ row['action'] }}</td></tr>
{% else %}<tr><td colspan="3">No events recorded.</td></tr>{% endfor %}
</table>
{% endblock %}
