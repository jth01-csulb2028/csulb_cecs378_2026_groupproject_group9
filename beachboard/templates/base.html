<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BeachBoard Lite{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('clubs') }}">BeachBoard Lite</a>
    <nav>
      <a href="{{ url_for('clubs') }}">Clubs</a>
      {% if g.user %}
        <a href="{{ url_for('profile') }}">Profile</a>
        {% if g.user['role'] == 'admin' %}
          <a href="{{ url_for('admin_users') }}">Users</a>
          <a href="{{ url_for('admin_audit') }}">Audit</a>
        {% endif %}
        <form method="post" action="{{ url_for('logout') }}"><button>Sign out</button></form>
      {% else %}
        <a href="{{ url_for('login') }}">Sign in</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% for message in get_flashed_messages() %}<p class="notice">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
